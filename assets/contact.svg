<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Say hello">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5a0"/><stop offset=".5" stop-color="#2d9cff"/><stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="cc"><rect width="1200" height="64" rx="14"/></clipPath>
  </defs>
  <rect width="1200" height="64" rx="14" fill="#080913"/>
  <g clip-path="url(#cc)">
    <g filter="url(#bl)" opacity=".55">
      <circle cx="90" cy="32" r="42" fill="#00f5a0">
        <animateTransform attributeName="transform" type="translate" values="0 0;1020 0;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1110" cy="32" r="42" fill="#7c5cff">
        <animateTransform attributeName="transform" type="translate" values="0 0;-1020 0;0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="63" rx="13.5" fill="#ffffff" fill-opacity=".04" stroke="url(#ink)" stroke-opacity=".45"/>
  <text x="600" y="40" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="19" letter-spacing=".5" fill="#c9cbe8"><tspan fill="#00f5a0">&gt;</tspan> say hello<tspan fill="#00f5a0" font-weight="700">_<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.49;.5;.99;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
</svg>
